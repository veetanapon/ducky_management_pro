<!DOCTYPE html>

<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>กิจกรรม | Ducky Management Pro</title>
    <link rel="stylesheet" href="css/dist/batch-events.bundle.css?v=20260606-174915">

</head>

<body data-page="farm_events">
    <header class="app-header container">
        <div class="header-leading">
            <button aria-label="open menu" class="icon-btn hamburger-btn" data-nav-toggle="" type="button">☰</button>
            <div>
                <h1 id="eventTitle">กิจกรรม</h1>
                <p class="muted" id="eventSubtitle">กำลังโหลดข้อมูล...</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="backBtn" type="button">←</button>
            <button class="icon-btn" id="logoutBtn" type="button">⎋</button>
        </div>
    </header>
    <main class="container page-body event-page">
        <section class="card-panel event-hero">
            <div class="section-card-head">
                <div>
                    <h3>ภาพรวมกิจกรรม</h3>
                    <p class="muted">บันทึกเหตุการณ์สำคัญเพื่อเทียบกับไข่และการกินอาหารใน report-view</p>
                </div>
                <span class="badge-inline muted-badge" id="eventPermissionBadge">กำลังโหลด</span>
            </div>
            <div class="event-summary-grid" id="eventSummaryCards"></div>
        </section>
        <section class="card-panel">
            <div class="section-card-head">
                <h3>Timeline เหตุการณ์</h3>
                <span class="badge-inline muted-badge" id="eventCountBadge">0 รายการ</span>
            </div>
            <div class="event-timeline" id="eventTimeline">
                <div class="empty-state">กำลังโหลด...</div>
            </div>
        </section>
    </main>
    <div id="eventFabRoot"></div>
    <div aria-hidden="true" class="sheet hidden" id="eventSheet">
        <div class="sheet-backdrop" id="eventSheetBackdrop"></div>
        <div class="sheet-panel">
            <div class="sheet-header">
                <span id="eventSheetTitle">บันทึกกิจกรรม</span>
                <button id="eventSheetCloseBtn" type="button">×</button>
            </div>
            <form class="sheet-body form-stack" id="batchEventForm">
                <input id="eventActionType" type="hidden" />
                <input id="eventEventType" type="hidden" />
                <div class="sheet-field-grid sheet-field-grid--2 event-date-range-grid">
                    <div>
                        <label class="field-label">วันที่เริ่ม</label>
                        <input id="eventStartDate" required="" type="date" />
                    </div>
                    <div>
                        <label class="field-label">วันที่สิ้นสุด</label>
                        <input id="eventEndDate" required="" type="date" />
                    </div>
                </div>
                <label class="event-distribute-row field-label" id="eventDistributeWrap">
                    <input checked="" id="eventDistributeCost" type="checkbox" />
                    <span>กระจายต้นทุนตามจำนวนวัน</span>
                </label>
                <div class="event-dynamic-fields" id="eventDynamicFields"></div>
            </form>
            <div class="sheet-footer sheet-footer--dual">
                <button class="secondary-btn" id="eventSheetCancelBtn" type="button">ยกเลิก</button>
                <button form="batchEventForm" id="eventSubmitBtn" type="submit">บันทึกกิจกรรม</button>
            </div>
        </div>
    </div>
    <script defer src="js/dist/batch-events.bundle.js?v=20260606-174915"></script>

</body>

</html>
