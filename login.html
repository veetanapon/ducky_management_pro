<!DOCTYPE html>

<html lang="th">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    name="viewport" />
  <title>Login | Ducky Management Pro</title>
  <link rel="stylesheet" href="css/dist/login.bundle.css?v=20260606-174915">
</head>

<body class="dm-login-page">
  <main class="dm-login-shell">
    <section aria-labelledby="loginTitle" class="dm-login-card">
      <header class="dm-login-header">
        <span class="dm-login-title" id="loginTitle">เข้าสู่ระบบ</span>
      </header>
      <form class="dm-login-form" id="loginForm">
        <p class="dm-login-note">กรอกอีเมลเพื่อเข้าใช้งาน</p>
        <input autocomplete="email" class="dm-login-input" id="email" placeholder="your@email.com" required=""
          type="email" />
        <input autocomplete="off" class="dm-login-input dm-hidden" id="deviceName" placeholder="ชื่ออุปกรณ์ (ไม่บังคับ)"
          type="text" />
        <button class="dm-login-submit" id="submitLogin" type="submit">เข้าสู่ระบบ</button>
        <p class="dm-login-status" id="status"></p>
      </form>
    </section>
  </main>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      AppAuth.bootstrapLoginPage();
    });
  </script>
  <script defer src="js/dist/login.bundle.js?v=20260606-174915"></script>

</body>

</html>
