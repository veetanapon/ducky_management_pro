<!DOCTYPE html>

<html lang="th">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>Admin Permissions | Ducky Management Pro</title>
    <link rel="stylesheet" href="css/dist/admin-permissions.bundle.css?v=20260606-174915">

</head>

<body data-page="admin_permissions">
    <header class="app-header container">
        <div class="header-leading">
            <button aria-label="open menu" class="icon-btn hamburger-btn" data-nav-toggle="" type="button">☰</button>
            <div>
                <h1>กำหนดสิทธิ์ผู้ใช้</h1>
                <p class="muted" id="adminPermissionSubtitle">เลือก user และ batch เพื่อกำหนดสิทธิ์รายโมดูล</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="backBtn" type="button">←</button>
            <button class="icon-btn" id="logoutBtn" type="button">⎋</button>
        </div>
    </header>
    <main class="container page-body module-page-layout">
        <section class="card-panel access-page-card">
            <div class="section-card-head">
                <h3>เลือกเป้าหมาย</h3>
                <span class="badge-inline success" id="adminPermissionRoleBadge">admin</span>
            </div>
            <form class="form-stack" id="adminPermissionForm">
                <label class="field-label">เลือก batch</label>
                <input id="adminBatchSearch" list="adminBatchList" placeholder="ค้นหาชื่อ batch" required=""
                    type="search" />
                <datalist id="adminBatchList"></datalist>
                <label class="field-label">เลือกผู้ใช้</label>
                <input id="adminUserSearch" list="adminUserList" placeholder="ค้นหาด้วย email หรือชื่อฟาร์ม" required=""
                    type="search" />
                <datalist id="adminUserList"></datalist>
                <div class="permission-card-grid permission-card-grid--3" id="adminPermissionMatrix">
                    <div class="empty-state">เลือก batch และ user ก่อนเพื่อแสดงสิทธิ์รายโมดูล</div>
                </div>
                <div class="access-action-row">
                    <button class="secondary-btn" id="adminLoadGrantedBtn" type="button">แสดงรายชื่อผู้มีสิทธิ์</button>
                    <button id="adminPermissionSaveBtn" type="submit">บันทึกสิทธิ์ทั้งหมด</button>
                </div>
            </form>
        </section>
        <section class="card-panel access-page-card">
            <div class="section-card-head">
                <h3>รายชื่อผู้มีสิทธิ์ใน batch ที่เลือก</h3>
                <span class="badge-inline muted-badge" id="adminGrantedCountBadge">ยังไม่โหลด</span>
            </div>
            <p class="muted" id="adminGrantedHint">กดปุ่ม “แสดงรายชื่อผู้มีสิทธิ์” เพื่อดึงข้อมูลจากชีทเมื่อจำเป็น</p>
            <div class="access-member-list is-idle" id="adminGrantedList">
                <div class="empty-state">ยังไม่ได้ดึงข้อมูล</div>
            </div>
        </section>
    </main>
    <script defer src="js/dist/admin-permissions.bundle.js?v=20260606-174915"></script>

</body>

</html>
